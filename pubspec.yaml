name: sonpur_sewa_samiti
description: "A Smart Agricultural Co-operative Mobile App for Sonpur Sewa Samiti with AI Crop Diagnosis, Dynamic Calendar, Fertilizer Calculator, Store, and Admin Console."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
